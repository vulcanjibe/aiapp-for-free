name: FreeHub CI/CD - Vercel Build & Test

on:
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint & Type Check
        run: npm run lint

      - name: Test Build Production
        env:
          MONGODB_URI: "mongodb://127.0.0.1:27017/freehub"
          NEXTAUTH_SECRET: "ci_secret_key_12345"
          NEXTAUTH_URL: "http://localhost:3000"
        run: npm run build
